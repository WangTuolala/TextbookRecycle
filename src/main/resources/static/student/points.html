<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>积分收支 · 学生 | GLU</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/student.css">
</head>
<body>
<nav>
    <div class="nav-brand">📘 GLU · 学生端</div>
    <div class="nav-links">
        <a href="/student/notice.html">公告通知</a>
        <a href="/student/index.html">首页集市</a>
        <a href="/student/profile.html">个人信息</a>
        <a href="/student/recycle.html">教材回收</a>
        <a href="/student/points.html" class="active">积分收支</a>
        <a href="/student/exchange.html">积分兑换</a>
    </div>
    <div class="nav-user">
            <span class="nav-user-info">
                👤 <span id="navUserName">同学</span>
                <span class="points"><span id="navUserPoints">0</span>积分</span>
            </span>
        <button class="logout-btn" onclick="handleLogout()">退出</button>
    </div>
</nav>

<main class="points-main-full">
    <!-- 上半部分：当前总积分 -->
    <div class="points-header">
        <div class="points-card">
            <div class="points-icon">💰</div>
            <div class="points-info">
                <span class="points-label">当前总积分</span>
                <span class="points-value" id="totalPoints">200</span>
            </div>
        </div>
    </div>

    <!-- 下半部分：积分流水记录 -->
    <div class="points-records">
        <div class="records-header">
            <h3>📋 积分流水记录</h3>
            <div class="filter-bar">
                <div class="filter-group">
                    <span class="filter-label">收支类型：</span>
                    <select id="typeFilter" class="filter-select">
                        <option value="all">全部</option>
                        <option value="income">收入</option>
                        <option value="expense">支出</option>
                    </select>
                </div>
                <div class="filter-group">
                    <span class="filter-label">类别：</span>
                    <select id="categoryFilter" class="filter-select">
                        <option value="all">全部</option>
                        <option value="book">教材</option>
                        <option value="prize">奖品</option>
                    </select>
                </div>
                <button class="btn-filter" id="resetFilterBtn">重置筛选</button>
            </div>
        </div>

        <div class="records-table-wrapper">
            <table class="points-table">
                <thead>
                <tr>
                    <th>时间</th>
                    <th>类型</th>
                    <th>积分变动</th>
                    <th>结余</th>
                    <th>说明</th>
                    <th>类别</th>
                </tr>
                </thead>
                <tbody id="pointsTableBody">
                <!-- 动态生成的数据 -->
                </tbody>
            </table>
        </div>

        <!-- 无数据提示 -->
        <div class="no-data-message" id="noDataMessage" style="display: none;">
            <p>📭 暂无符合条件的积分记录</p>
        </div>
    </div>
</main>

<script src="/js/common.js"></script>
<script src="/js/student.js"></script>
</body>
</html>
