<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息 · 后勤 | GLU</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/logistics.css">
</head>
<body>
<nav class="logi-nav">
    <div class="nav-brand">📦 后勤联动 · GL大学</div>
    <div class="nav-links">
        <a href="/logistics/index.html">领取管理</a>
        <a href="/logistics/profile.html" class="active">个人信息</a>
        <a href="/logistics/prize-mgmt.html">奖品管理</a>
        <a href="/logistics/notice.html">公告通知</a>
    </div>
    <div class="nav-user">
        <span class="nav-user-info">
            👤 王师傅
        </span>
        <button class="logout-btn" onclick="handleLogout()">退出</button>
    </div>
</nav>

<main class="logistics-profile-main">
    <div class="profile-card">
        <h2>后勤人员信息</h2>
        <div class="profile-info-grid">
            <div class="info-row">
                <span class="info-label">工号：</span>
                <span class="info-value">B2018012</span>
            </div>
            <div class="info-row">
                <span class="info-label">姓名：</span>
                <span class="info-value">王师傅</span>
            </div>
            <div class="info-row">
                <span class="info-label">部门：</span>
                <span class="info-value">后勤服务中心</span>
            </div>
            <div class="info-row">
                <span class="info-label">岗位：</span>
                <span class="info-value">奖品发放员</span>
            </div>
            <div class="info-row">
                <span class="info-label">入职年份：</span>
                <span class="info-value">2018年</span>
            </div>
            <div class="info-row">
                <span class="info-label">联系电话：</span>
                <span class="info-value">159****5678</span>
            </div>
            <div class="info-row">
                <span class="info-label">工作地点：</span>
                <span class="info-value">后勤中心3号窗口</span>
            </div>
        </div>
        <div class="profile-actions">
            <button class="btn-primary" data-modal="infoModal">修改个人信息</button>
            <button class="btn-secondary" data-modal="pwdModal">修改密码</button>
        </div>
    </div>
</main>

<!-- 修改个人信息弹窗 -->
<div id="infoModal" class="modal">
    <div class="modal-content modal-lg">
        <span class="close-btn">&times;</span>
        <h3>修改个人信息</h3>
        <div class="modal-field">
            <label>姓名</label>
            <input type="text" id="logiProfileName" value="王师傅">
        </div>
        <div class="modal-field">
            <label>部门</label>
            <input type="text" id="logiProfileDept" value="后勤服务中心">
        </div>
        <div class="modal-field">
            <label>岗位</label>
            <input type="text" id="logiProfilePosition" value="奖品发放员">
        </div>
        <div class="modal-field">
            <label>入职年份</label>
            <input type="text" id="logiProfileYear" value="2018">
        </div>
        <div class="modal-field">
            <label>联系电话</label>
            <input type="tel" id="logiProfilePhone" value="159****5678">
        </div>
        <div class="modal-field">
            <label>工作地点</label>
            <input type="text" id="logiProfileWorkplace" value="后勤中心3号窗口">
        </div>
        <div class="modal-actions">
            <button class="btn-primary" onclick="saveLogisticsProfile()">保存</button>
            <button class="btn-secondary" onclick="Modal.close('infoModal')">取消</button>
        </div>
    </div>
</div>

<!-- 修改密码弹窗 -->
<div id="pwdModal" class="modal">
    <div class="modal-content modal-lg">
        <span class="close-btn">&times;</span>
        <h3>修改密码</h3>
        <div class="modal-field">
            <input type="password" placeholder="当前密码">
        </div>
        <div class="modal-field">
            <input type="password" placeholder="新密码">
        </div>
        <div class="modal-field">
            <input type="password" placeholder="确认新密码">
        </div>
        <div class="modal-actions">
            <button class="btn-primary" onclick="Modal.close('pwdModal'); alert('密码已修改')">修改</button>
            <button class="btn-secondary" onclick="Modal.close('pwdModal')">取消</button>
        </div>
    </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/logistics.js"></script>
</body>
</html>
