<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后勤个人信息</title>
    <link rel="stylesheet" href="/css/logistics.css">
    <link rel="stylesheet" href="/css/modal.css">
</head>
<body class="logistics-page">

<div class="logistics-header">
    <h2>后勤个人信息</h2>
    <div class="header-actions">
        <button class="btn-secondary" onclick="logout()">退出登录</button>
    </div>
</div>

<div class="nav-user-info">
    <span id="logisticsUserName">加载中...</span>
</div>

<div class="profile-container">
    <div class="profile-card">
        <div class="profile-card-left">
            <div class="profile-info-grid">
                <div class="profile-info-row">
                    <span class="profile-info-label">姓名</span>
                    <span class="profile-info-value">-</span>
                </div>
                <div class="profile-info-row">
                    <span class="profile-info-label">工号</span>
                    <span class="profile-info-value">-</span>
                </div>
                <div class="profile-info-row">
                    <span class="profile-info-label">部门</span>
                    <span class="profile-info-value">-</span>
                </div>
                <div class="profile-info-row">
                    <span class="profile-info-label">入职年份</span>
                    <span class="profile-info-value">-</span>
                </div>
                <div class="profile-info-row">
                    <span class="profile-info-label">联系电话</span>
                    <span class="profile-info-value">-</span>
                </div>
                <div class="profile-info-row">
                    <span class="profile-info-label">工作地点</span>
                    <span class="profile-info-value">-</span>
                </div>
            </div>
            <div class="profile-actions">
                <button class="btn-primary" data-modal="infoModal">修改信息</button>
                <button class="btn-secondary" data-modal="pwdModal">修改密码</button>
            </div>
        </div>
    </div>
</div>

<!-- 修改个人信息弹窗 -->
<div id="infoModal" class="modal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h3>修改个人信息</h3>
        <div class="modal-field">
            <label>姓名</label>
            <input type="text" id="logiProfileName" placeholder="请输入姓名">
        </div>
        <div class="modal-field">
            <label>部门</label>
            <input type="text" id="logiProfileDept" placeholder="请输入部门">
        </div>
        <div class="modal-field">
            <label>入职年份</label>
            <input type="text" id="logiProfileYear" placeholder="请输入年份，如2020">
        </div>
        <div class="modal-field">
            <label>联系电话</label>
            <input type="text" id="logiProfilePhone" placeholder="请输入联系电话">
        </div>
        <div class="modal-field">
            <label>工作地点</label>
            <input type="text" id="logiProfileWorkplace" placeholder="请输入工作地点">
        </div>
        <div class="modal-actions">
            <button class="btn-primary">保存</button>
            <button class="btn-secondary" onclick="Modal.close('infoModal')">取消</button>
        </div>
    </div>
</div>

<!-- 修改密码弹窗 -->
<div id="pwdModal" class="modal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h3>修改密码</h3>
        <div class="modal-field pwd-field">
            <label>当前密码</label>
            <input type="password" id="oldPassword" placeholder="当前密码">
            <button type="button" class="pwd-toggle" data-for="oldPassword">⊙</button>
        </div>
        <div class="modal-field pwd-field">
            <label>新密码</label>
            <input type="password" id="newPassword" placeholder="新密码">
            <button type="button" class="pwd-toggle" data-for="newPassword">⊙</button>
        </div>
        <div class="modal-field pwd-field">
            <label>确认新密码</label>
            <input type="password" id="confirmPassword" placeholder="确认新密码">
            <button type="button" class="pwd-toggle" data-for="confirmPassword">⊙</button>
        </div>
        <div class="modal-actions">
            <button class="btn-primary" onclick="changePassword()">修改</button>
            <button class="btn-secondary" onclick="Modal.close('pwdModal')">取消</button>
        </div>
    </div>
</div>

<!-- 学生信息弹窗 -->
<div id="studentInfoModal" class="modal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h3>学生信息</h3>
        <div id="studentInfoContent"></div>
    </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/logistics.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.pwd-toggle').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var inputId = btn.getAttribute('data-for');
            var input = document.getElementById(inputId);
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '×';
            } else {
                input.type = 'password';
                btn.textContent = '⊙';
            }
        });
    });
});
</script>
</body>
</html>
