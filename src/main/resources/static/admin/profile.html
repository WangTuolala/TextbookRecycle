<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>个人信息 · 管理员 | GLU</title>
 <link rel="stylesheet" href="/css/style.css">
 <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<nav>
 <div class="nav-brand">⚙️ 管理员面板 · GLU</div>
 <div class="nav-links">
 <a href="/admin/index.html">数据总览</a>
 <a href="/admin/profile.html" class="active">个人信息</a>
 <a href="/admin/audit.html">领取管理</a>
 <a href="/admin/evaluate.html">评估核算</a>
 <a href="/admin/rule.html">积分规则</a>
 <a href="/admin/inventory-all.html">库存管理</a>
 <a href="/admin/notice.html">公告通知</a>
 <a href="/admin/book-mgmt.html">书籍管理</a>
 <a href="/admin/category-mgmt.html">分类管理</a>
 </div>
 <div class="nav-user">
 <span class="nav-user-info">
 👤 <span id="navUserName">管理员</span>
 </span>
 <button class="logout-btn" onclick="handleLogout()">退出</button>
 </div>
</nav>

<main class="admin-profile-main">
 <div class="profile-card">
 <h2>管理员个人信息</h2>
 <div class="profile-info-grid">
 <div class="info-row">
 <span class="info-label">工号：</span>
 <span class="info-value" id="profileUsername">-</span>
 </div>
 <div class="info-row">
 <span class="info-label">姓名：</span>
 <span class="info-value" id="profileName">-</span>
 </div>
 <div class="info-row">
 <span class="info-label">部门：</span>
 <span class="info-value" id="profileDept">-</span>
 </div>
 <div class="info-row">
 <span class="info-label">入职年份：</span>
 <span class="info-value" id="profileYear">-</span>
 </div>
 <div class="info-row">
 <span class="info-label">联系电话：</span>
 <span class="info-value" id="profilePhone">-</span>
 </div>
 <div class="info-row">
 <span class="info-label">工作地点：</span>
 <span class="info-value" id="profileLocation">-</span>
 </div>
 </div>
 <div class="profile-actions">
 <button class="btn-primary" data-modal="infoModal">修改个人信息</button>
 <button class="btn-secondary" data-modal="pwdModal">修改密码</button>
 </div>
 </div>
</main>

<!-- 修改个人信息弹窗 -->
<div id="infoModal" class="modal">
 <div class="modal-content modal-lg">
 <span class="close-btn">&times;</span>
 <h3>修改个人信息</h3>
 <div class="modal-field">
 <input type="text" id="editName" placeholder="姓名">
 </div>
 <div class="modal-field">
 <input type="text" id="editDept" placeholder="部门">
 </div>
 <div class="modal-field">
 <input type="text" id="editYear" placeholder="入职年份">
 </div>
 <div class="modal-field">
 <input type="tel" id="editPhone" placeholder="联系电话">
 </div>
 <div class="modal-field">
 <input type="text" id="editLocation" placeholder="工作地点">
 </div>
 <div class="modal-actions">
 <button class="btn-primary" onclick="saveProfile()">保存</button>
 <button class="btn-secondary" onclick="Modal.close('infoModal')">取消</button>
 </div>
 </div>
</div>

<!-- 修改密码弹窗 -->
<div id="pwdModal" class="modal">
 <div class="modal-content modal-lg">
 <span class="close-btn">&times;</span>
 <h3>修改密码</h3>
 <div class="modal-field">
 <input type="password" id="oldPassword" placeholder="当前密码">
 </div>
 <div class="modal-field">
 <input type="password" id="newPassword" placeholder="新密码">
 </div>
 <div class="modal-field">
 <input type="password" id="confirmPassword" placeholder="确认新密码">
 </div>
 <div class="modal-actions">
 <button class="btn-primary" onclick="changePassword()">修改</button>
 <button class="btn-secondary" onclick="Modal.close('pwdModal')">取消</button>
 </div>
 </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
