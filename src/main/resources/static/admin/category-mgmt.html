<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类管理 · 管理员 | GLU</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<nav>
    <div class="nav-brand">⚙️ 管理员面板 · GLU</div>
    <div class="nav-links">
        <a href="/admin/index.html">数据总览</a>
        <a href="/admin/profile.html">个人信息</a>
        <a href="/admin/audit.html">领取管理</a>
        <a href="/admin/evaluate.html">评估核算</a>
        <a href="/admin/rule.html">积分规则</a>
        <a href="/admin/inventory-all.html">库存管理</a>
        <a href="/admin/notice.html">公告通知</a>
        <a href="/admin/book-mgmt.html">书籍管理</a>
        <a href="/admin/category-mgmt.html" class="active">分类管理</a>
    </div>
    <div class="nav-user">
        <span class="nav-user-info">
            👤 张老师
        </span>
        <button class="logout-btn" onclick="handleLogout()">退出</button>
    </div>
</nav>

<main class="category-mgmt-main">
    <div class="category-mgmt-header">
        <h2 class="category-mgmt-title">📂 专业分类管理</h2>
        <button class="btn-primary" id="addCategoryBtn" onclick="openCategoryModal()">+ 新增专业</button>
    </div>

    <!-- 搜索筛选栏 -->
    <div class="category-mgmt-filters">
        <div class="filter-group">
            <span class="filter-label">状态筛选：</span>
            <select id="categoryStatusFilter" class="filter-select">
                <option value="all">全部</option>
                <option value="active">启用</option>
                <option value="inactive">禁用</option>
            </select>
        </div>
        <div class="filter-group">
            <span class="filter-label">搜索：</span>
            <input type="text" id="categorySearchInput" placeholder="搜索专业名称" class="search-input">
        </div>
        <button class="btn-primary" id="searchCategoryBtn" onclick="searchCategories()">🔍 搜索</button>
        <button class="btn-secondary" id="resetCategoryBtn" onclick="resetCategoryFilters()">重置筛选</button>
    </div>

    <div class="category-table-container">
        <table class="data-table category-table">
            <thead>
            <tr>
                <th>分类名称</th>
                <th>状态</th>
                <th>创建时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="categoryTableBody">
            <!-- 动态生成 -->
            </tbody>
        </table>
    </div>
</main>

<!-- 新增/编辑专业弹窗 -->
<div id="categoryModal" class="modal">
    <div class="modal-content modal-md">
        <span class="close-btn" onclick="Modal.close('categoryModal')">&times;</span>
        <h3 id="categoryModalTitle">📂 新增专业</h3>
        <form id="categoryForm" onsubmit="return false;">
            <input type="hidden" id="categoryId">
            <div class="modal-field">
                <label>专业名称 <span class="required">*</span></label>
                <input type="text" id="categoryName" placeholder="请输入专业名称" required>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="Modal.close('categoryModal')">取消</button>
                <button type="submit" class="btn-primary" onclick="saveCategory()">保存</button>
            </div>
        </form>
    </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
