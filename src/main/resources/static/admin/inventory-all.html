<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全部库存 · 管理员 | GLU</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<nav>
    <div class="nav-brand">⚙️ 管理员面板 · GLU</div>
    <div class="nav-links">
        <a href="/admin/index.html">数据总览</a>
        <a href="/admin/profile.html">个人信息</a>
        <a href="/admin/audit.html">领取管理</a>
        <a href="/admin/evaluate.html">评估核算</a>
        <a href="/admin/rule.html">积分规则</a>
        <a href="/admin/inventory-all.html" class="active">库存管理</a>
        <a href="/admin/notice.html">公告通知</a>
        <a href="/admin/book-mgmt.html">书籍管理</a>
        <a href="/admin/category-mgmt.html">分类管理</a>
    </div>
    <div class="nav-user">
            <span class="nav-user-info">
                👤 <span id="navUserName">管理员</span>
            </span>
        <button class="logout-btn" onclick="handleLogout()">退出</button>
    </div>
</nav>

<main class="inventory-page">
    <h2 class="inventory-title">📦 全部库存</h2>

    <div class="inventory-tabs">
        <a href="/admin/inventory-all.html" class="tab-btn active">全部库存</a>
        <a href="/admin/inventory-in.html" class="tab-btn">入库记录</a>
        <a href="/admin/inventory-out.html" class="tab-btn">出库记录</a>
        <a href="/admin/inventory-check.html" class="tab-btn">盘点</a>
    </div>

    <div class="inventory-actions">
        <div class="inventory-actions-left">
            <input type="text" id="inventorySearchInput" placeholder="搜索教材名称或ISBN" class="search-input">
            <button class="btn-primary" onclick="searchInventoryTable()">🔍 搜索</button>
            <button class="btn-secondary" onclick="openStockInModal()">+ 新增入库</button>
            <button class="btn-secondary" onclick="openStockOutModal()">+ 新增出库</button>
        </div>
    </div>

    <table class="data-table inventory-table">
        <thead>
        <tr>
            <th>教材名称</th>
            <th>ISBN</th>
            <th>类型</th>
            <th>数量</th>
            <th>时间</th>
            <th>经手人</th>
        </tr>
        </thead>
        <tbody id="inventoryTableBody">
        </tbody>
    </table>
</main>

<!-- 入库弹窗 -->
<div id="stockInModal" class="modal">
    <div class="modal-content modal-lg">
        <span class="close-btn" onclick="Modal.close('stockInModal')">&times;</span>
        <h3>📥 教材入库</h3>
        <div class="modal-field">
            <label>选择教材</label>
            <select id="stockInBookSelect" class="filter-select">
                <option value="">-- 请选择教材 --</option>
            </select>
        </div>
        <div class="modal-field">
            <label>入库数量</label>
            <input type="number" id="stockInQuantity" value="1" min="1" step="1">
        </div>
        <div class="modal-field">
            <label>备注</label>
            <input type="text" id="stockInRemark" placeholder="可选备注">
        </div>
        <div class="modal-actions">
            <button class="btn-primary" onclick="submitStockIn()">确认入库</button>
            <button class="btn-secondary" onclick="Modal.close('stockInModal')">取消</button>
        </div>
    </div>
</div>

<!-- 出库弹窗 -->
<div id="stockOutModal" class="modal">
    <div class="modal-content modal-lg">
        <span class="close-btn" onclick="Modal.close('stockOutModal')">&times;</span>
        <h3>📤 教材出库</h3>
        <div class="modal-field">
            <label>选择教材</label>
            <select id="stockOutBookSelect" class="filter-select">
                <option value="">-- 请选择教材 --</option>
            </select>
        </div>
        <div class="modal-field">
            <label>出库数量</label>
            <input type="number" id="stockOutQuantity" value="1" min="1" step="1">
        </div>
        <div class="modal-field">
            <label>备注</label>
            <input type="text" id="stockOutRemark" placeholder="可选备注">
        </div>
        <div class="modal-actions">
            <button class="btn-primary" onclick="submitStockOut()">确认出库</button>
            <button class="btn-secondary" onclick="Modal.close('stockOutModal')">取消</button>
        </div>
    </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
