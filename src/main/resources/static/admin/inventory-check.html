<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>库存盘点 · 管理员 | GLU</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<nav>
    <div class="nav-brand">⚙️ 管理员面板 · GLU</div>
    <div class="nav-links">
        <a href="/admin/index.html">数据总览</a>
        <a href="/admin/profile.html">个人信息</a>
        <a href="/admin/audit.html">领取管理</a>
        <a href="/admin/evaluate.html">评估核算</a>
        <a href="/admin/rule.html">积分规则</a>
        <a href="/admin/inventory-all.html" class="active">库存管理</a>
        <a href="/admin/notice.html">公告通知</a>
        <a href="/admin/book-mgmt.html">书籍管理</a>
        <a href="/admin/category-mgmt.html">分类管理</a>
    </div>
    <div class="nav-user">
        <span class="nav-user-info">👤 <span id="navUserName">管理员</span></span>
        <button class="logout-btn" onclick="handleLogout()">退出</button>
    </div>
</nav>

<main class="inventory-check-page">
    <h2 class="inventory-title">📦 库存盘点</h2>

    <div class="inventory-tabs">
        <a href="/admin/inventory-all.html" class="tab-btn">全部库存</a>
        <a href="/admin/inventory-in.html" class="tab-btn">入库记录</a>
        <a href="/admin/inventory-out.html" class="tab-btn">出库记录</a>
        <a href="/admin/inventory-check.html" class="tab-btn active">盘点</a>
    </div>

    <!-- 盘点统计 -->
    <div class="check-stats-row">
        <div class="stat-card">
            <div class="stat-label">📦 总库存</div>
            <div class="stat-value" id="statTotalStock">0</div>
        </div>
        <div class="stat-card success">
            <div class="stat-label">📈 盘盈</div>
            <div class="stat-value" id="statProfit">0</div>
        </div>
        <div class="stat-card danger">
            <div class="stat-label">📉 盘亏</div>
            <div class="stat-value" id="statLoss">0</div>
        </div>
    </div>

    <div class="inventory-actions">
        <div class="inventory-actions-left">
            <input type="text" id="checkSearchInput" placeholder="搜索教材名称或ISBN" class="search-input">
            <button class="btn-primary" onclick="searchCheckTable()">🔍 搜索</button>
            <button class="btn-secondary" onclick="openCheckModal()">开始盘点</button>
        </div>
        <div class="inventory-actions-right">
            <span class="diff-count">差异总数: <span class="diff-number" id="diffTotal">0</span></span>
        </div>
    </div>

    <table class="data-table inventory-table">
        <thead>
        <tr>
            <th>教材名称</th>
            <th>ISBN</th>
            <th>全部库存</th>
            <th>实际盘点</th>
            <th>差异</th>
            <th>备注</th>
            <th>经手人</th>
            <th>盘点时间</th>
        </tr>
        </thead>
        <tbody id="checkTableBody">
        </tbody>
    </table>
</main>

<!-- 开始盘点弹窗 -->
<div id="checkModal" class="modal">
    <div class="modal-content modal-lg">
        <span class="close-btn" onclick="Modal.close('checkModal')">&times;</span>
        <h3>🔍 开始盘点</h3>
        <div class="modal-field">
            <label>书籍名称 <span class="required">*</span></label>
            <select id="checkBookSelect" class="filter-select" onchange="onCheckBookChange()">
                <option value="">-- 请选择教材 --</option>
            </select>
        </div>
        <div class="modal-field">
            <label>ISBN</label>
            <input type="text" id="checkIsbn" readonly>
        </div>
        <div class="modal-field">
            <label>全部库存</label>
            <input type="number" id="checkSystemStock" readonly>
        </div>
        <div class="modal-field">
            <label>实际盘点 <span class="required">*</span></label>
            <input type="number" id="checkActualStock" value="0" min="0" onchange="calcCheckDiff()">
        </div>
        <div class="modal-field">
            <label>差异</label>
            <input type="text" id="checkDiff" readonly>
        </div>
        <div class="modal-field">
            <label>备注 <span class="required">*</span></label>
            <select id="checkRemark">
                <option value="">-- 请选择 --</option>
                <option value="正常">正常</option>
                <option value="多">多</option>
                <option value="少">少</option>
            </select>
        </div>
        <div class="modal-field">
            <label>经手人 <span class="required">*</span></label>
            <input type="text" id="checkOperatorInput" placeholder="请输入经手人姓名">
        </div>
        <div class="modal-actions">
            <button class="btn-primary" onclick="submitCheckItem()">确认添加</button>
            <button class="btn-secondary" onclick="Modal.close('checkModal')">取消</button>
        </div>
    </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
