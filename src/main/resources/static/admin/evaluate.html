<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评估核算 · 管理员 | GLU</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<nav>
    <div class="nav-brand">⚙️ 管理员面板 · GLU</div>
    <div class="nav-links">
        <a href="/admin/index.html">数据总览</a>
        <a href="/admin/profile.html">个人信息</a>
        <a href="/admin/audit.html">领取管理</a>
        <a href="/admin/evaluate.html" class="active">评估核算</a>
        <a href="/admin/rule.html">积分规则</a>
        <a href="/admin/inventory-all.html">库存管理</a>
        <a href="/admin/notice.html">公告通知</a>
        <a href="/admin/book-mgmt.html">书籍管理</a>
        <a href="/admin/category-mgmt.html">分类管理</a>
    </div>
    <div class="nav-user">
        <span class="nav-user-info" id="adminUserName">
            👤 <span id="navUserName">加载中...</span>
        </span>
        <button class="logout-btn" onclick="handleLogout()">退出</button>
    </div>
</nav>

<main class="evaluate-page">
    <h2 class="evaluate-title">⚖️ 教材评估与积分核算</h2>
    <p class="evaluate-subtitle">根据品相标准核算积分，审核通过后同步至库存</p>

    <div class="pickup-stats" style="margin-bottom:16px;">
        <span class="stat-badge">总计: <strong id="evalTotal">0</strong> 条</span>
        <span class="stat-badge pending-badge">待审核: <strong id="evalPending">0</strong></span>
        <span class="stat-badge approved-badge">已审核: <strong id="evalApproved">0</strong></span>
        <span class="stat-badge completed-badge">已完成: <strong id="evalCompleted">0</strong></span>
    </div>

    <!-- 搜索和筛选栏 - 靠右 -->
    <div class="evaluate-filters-right">
        <div class="filter-group">
            <span class="filter-label">状态筛选：</span>
            <select id="statusFilter" class="filter-select">
                <option value="all">全部</option>
                <option value="PENDING">待审核</option>
                <option value="APPROVED">已通过</option>
                <option value="SYNCED">已同步</option>
                <option value="REJECTED">已拒绝</option>
            </select>
        </div>
        <div class="filter-group">
            <span class="filter-label">搜索：</span>
            <input type="text" id="searchInput" placeholder="搜索学生姓名、学号或教材名称" class="search-input">
        </div>
        <button class="btn-primary" id="searchBtn">🔍 搜索</button>
        <button class="btn-secondary" id="resetBtn">重置筛选</button>
    </div>

    <div class="records-table-wrapper">
        <table class="data-table evaluate-table">
            <thead>
            <tr>
                <th>预约单号</th>
                <th>学生信息</th>
                <th>教材信息</th>
                <th>品相自评</th>
                <th>管理员评估</th>
                <th>建议积分</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="evaluateTbody">
            <!-- 动态生成 -->
            </tbody>
        </table>
    </div>

    <!-- 学生信息弹窗 -->
    <div id="studentInfoModal" class="modal">
        <div class="modal-content modal-md">
            <span class="close-btn" onclick="Modal.close('studentInfoModal')">&times;</span>
            <h3>👤 学生详细信息</h3>
            <div class="student-info-content" id="studentInfoContent">
            </div>
            <div class="modal-actions">
                <button class="btn-primary" onclick="Modal.close('studentInfoModal')">关闭</button>
            </div>
        </div>
    </div>

    <!-- 预约详情弹窗 -->
    <div id="appointmentModal" class="modal">
        <div class="modal-content modal-lg">
            <span class="close-btn" onclick="Modal.close('appointmentModal')">&times;</span>
            <h3>📋 预约详情</h3>
            <div id="appointmentDetailContent">
                <!-- 动态填充 -->
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="Modal.close('appointmentModal')">关闭</button>
            </div>
        </div>
    </div>
    <!-- 同步积分弹窗 -->
    <div id="syncModal" class="modal">
        <div class="modal-content modal-sm">
            <span class="close-btn" onclick="Modal.close('syncModal')">&times;</span>
            <h3>🔄 同步积分</h3>
            <div class="modal-field">
                <label>教材名称</label>
                <div id="syncBookName" style="color:#174257;font-weight:500;padding:8px 0;">-</div>
            </div>
            <div class="modal-field">
                <label>学生</label>
                <div id="syncStudentName" style="color:#174257;padding:8px 0;">-</div>
            </div>
            <div class="modal-field">
                <label>品相评估</label>
                <select id="syncCondition" class="filter-select" style="width:100%;padding:8px;" onchange="updateSyncPoints()">
                    <option value="全新">全新</option>
                    <option value="良好" selected>良好</option>
                    <option value="一般">一般</option>
                    <option value="陈旧">陈旧</option>
                </select>
            </div>
            <div class="modal-field">
                <label>积分</label>
                <div id="syncPointsDisplay" style="font-size:1.4rem;font-weight:700;color:#28a745;padding:8px 0;">150</div>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="Modal.close('syncModal')">取消</button>
                <button class="btn-primary" id="confirmSyncBtn">确认同步</button>
            </div>
        </div>
    </div>
</main>

<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
